<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Interactive Session - Lumina Learning</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#ffb5a1",
                        "surface-dim": "#dddad4",
                        "surface-container-high": "#ebe8e2",
                        "inverse-surface": "#31302d",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#b59a7c",
                        "on-secondary-container": "#586749",
                        "surface-container-low": "#f7f3ed",
                        "on-error": "#ffffff",
                        "outline-variant": "#d8c2bc",
                        "on-secondary-fixed-variant": "#3d4b30",
                        "on-surface-variant": "#53433f",
                        "outline": "#85736e",
                        "tertiary-fixed-dim": "#dfc1a2",
                        "on-primary-fixed": "#380d03",
                        "secondary-fixed": "#d7e8c3",
                        "surface-container": "#f1ede7",
                        "surface-variant": "#e6e2dc",
                        "inverse-on-surface": "#f4f0ea",
                        "on-primary-fixed-variant": "#6f3728",
                        "on-secondary-fixed": "#131f08",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#bccca8",
                        "secondary": "#546346",
                        "surface-bright": "#fdf9f3",
                        "on-primary-container": "#5a2718",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#281805",
                        "surface-tint": "#8b4e3d",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#ffb5a1",
                        "background": "#fdf9f3",
                        "on-tertiary-fixed-variant": "#58432b",
                        "on-tertiary-container": "#45321b",
                        "primary": "#8b4e3d",
                        "primary-container": "#d68c78",
                        "tertiary-fixed": "#fdddbc",
                        "surface": "#fdf9f3",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#ffdbd1",
                        "tertiary": "#715a40",
                        "surface-container-highest": "#e6e2dc",
                        "on-surface": "#1c1c18",
                        "secondary-container": "#d5e5c0",
                        "on-background": "#1c1c18"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "tap-target-min": "64px",
                        "unit": "8px",
                        "section-gap": "48px",
                        "container-margin-desktop": "80px",
                        "container-margin-mobile": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Plus Jakarta Sans"],
                        "interactive-child": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "64px", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "interactive-child": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "48px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "44px", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "36px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["18px", { "lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "label-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.04em", "fontWeight": "600" }],
                        "body-lg": ["20px", { "lineHeight": "32px", "letterSpacing": "0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0; }
        .material-symbols-outlined.filled { font-variation-settings: 'FILL' 1; }
        
        @keyframes subtle-pulse {
            0% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.15); opacity: 0.2; }
            100% { transform: scale(1); opacity: 0.1; }
        }
        .pulse-ring {
            animation: subtle-pulse 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-background text-on-background h-full flex flex-col font-body-md overflow-hidden antialiased">
<!-- Top Navigation App Bar (Suppressed due to child-facing focused flow, replacing with a simple close/back utility to maintain focus) -->
<header class="w-full h-tap-target-min flex justify-between items-center px-container-margin-mobile md:px-container-margin-desktop shrink-0 relative z-10">
<button class="w-[64px] h-[64px] flex items-center justify-center text-primary rounded-full hover:bg-surface-container-high transition-colors active:scale-95 shadow-sm bg-surface">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
<!-- Progress Bar at the very top -->
<div class="flex-1 mx-8 max-w-2xl h-3 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-secondary w-1/3 rounded-full transition-all duration-1000 ease-out"></div>
</div>
<button class="w-[64px] h-[64px] flex items-center justify-center text-primary rounded-full hover:bg-surface-container-high transition-colors active:scale-95 shadow-sm bg-surface">
<span class="material-symbols-outlined text-3xl">help_outline</span>
</button>
</header>
<!-- Main Content Canvas - Singular, Fixed Layout -->
<main class="flex-1 flex flex-col w-full max-w-4xl mx-auto px-container-margin-mobile pb-safe h-full relative z-0">
<!-- Top Zone: Avatar & System Message -->
<section class="flex-1 flex flex-col justify-end items-center text-center pb-8 min-h-[30vh]">
<div class="w-32 h-32 mb-6 rounded-full overflow-hidden bg-surface-container-high border-4 border-surface shadow-[0_8px_24px_rgba(139,78,61,0.08)]">
<img class="w-full h-full object-cover" data-alt="A soft, friendly 3D rendered avatar of a gentle animal, perhaps a stylized bear or rabbit, designed for a low-arousal therapeutic children's app. The avatar is set against a clean, warm cream background. The lighting is soft and diffuse, avoiding harsh shadows. The color palette utilizes gentle terracottas, sage greens, and warm neutral tones to create a calming, non-threatening presence." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC13z3BqOe3kQE5wDBsBoC587sZcWyfZ333896mrN4CyirrZCSdeNMI2X4jiXSUVbLZ5qvOjEbZOuOboE0FmNIamGplfSV3qAfQdSmUYt4aC0iffUnjZu25p1sOvjWp4J0nD_iU4zBX4GoahZMmH7IxREw7unVmD3DRScF55X45wUQUygMGLsuRsABe0BWgVKMWJa97Xf23_xQQxW_32hdtXYWbwoJXzfR28nA9a7nn1M13ol_3zaXzYg"/>
</div>
<div class="flex items-center gap-4 bg-surface-container px-6 py-4 rounded-xl shadow-[0_4px_16px_rgba(139,78,61,0.04)]">
<h1 class="font-interactive-child text-interactive-child text-on-surface">Can you say "Hello"?</h1>
<button class="w-[48px] h-[48px] flex items-center justify-center bg-primary text-on-primary rounded-full hover:bg-surface-tint active:scale-95 transition-all shadow-sm">
<span class="material-symbols-outlined filled text-2xl">volume_up</span>
</button>
</div>
</section>
<!-- Middle Zone: Microphone Interaction -->
<section class="flex-1 flex flex-col justify-center items-center relative min-h-[40vh]">
<!-- Decorative animated rings -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="absolute w-64 h-64 bg-primary-container rounded-full pulse-ring"></div>
<div class="absolute w-80 h-80 bg-primary-container rounded-full pulse-ring" style="animation-delay: 1.5s;"></div>
</div>
<!-- Huge Tap Target Microphone -->
<button class="relative z-10 w-48 h-48 bg-primary rounded-full flex items-center justify-center shadow-[0_12px_32px_rgba(139,78,61,0.2)] hover:shadow-[0_8px_24px_rgba(139,78,61,0.15)] active:scale-95 active:shadow-[0_4px_12px_rgba(139,78,61,0.1)] transition-all duration-300">
<span class="material-symbols-outlined filled text-[80px] text-on-primary">mic</span>
</button>
<p class="mt-8 font-label-lg text-label-lg text-on-surface-variant z-10 bg-surface/80 px-4 py-2 rounded-full backdrop-blur-sm">Tap to listen</p>
<!-- Secondary Text Toggle (Optional fallback) -->
<button class="mt-4 px-6 py-3 border-2 border-secondary text-secondary rounded-full font-label-lg text-label-lg hover:bg-secondary-container/50 transition-colors z-10">
                I prefer to type
            </button>
</section>
<!-- Bottom Zone: Feedback Strip -->
<section class="h-32 flex items-center justify-center shrink-0">
<!-- Hidden by default, shown via JS on success -->
<div class="hidden flex items-center gap-3 bg-secondary-container text-on-secondary-container px-8 py-4 rounded-full shadow-[0_8px_24px_rgba(84,99,70,0.15)] animate-[slideUp_0.5s_ease-out]">
<span class="material-symbols-outlined filled text-3xl">star</span>
<span class="font-interactive-child text-interactive-child">Nice work!</span>
</div>
</section>
</main>
<!-- Suppressed BottomNavBar due to focused task intent -->
</body></html>
