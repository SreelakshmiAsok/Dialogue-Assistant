<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Soft, faint gradient background */
        .bg-soft-gradient {
            background: radial-gradient(circle at center, var(--tw-colors-surface-bright) 0%, var(--tw-colors-background) 100%);
        }
        /* Ambient glow for tactile button */
        .shadow-ambient {
            box-shadow: 0 12px 24px rgba(139,78,61,0.08), 0 4px 8px rgba(139,78,61,0.04);
        }
        .active-sink:active {
            transform: translateY(2px) scale(0.98);
            box-shadow: 0 4px 12px rgba(139,78,61,0.08), 0 2px 4px rgba(139,78,61,0.04);
        }
        
        /* Gentle pulse animation for the main action */
        @keyframes gentle-pulse {
            0% { box-shadow: 0 0 0 0 rgba(139, 78, 61, 0.2); }
            70% { box-shadow: 0 0 0 24px rgba(139, 78, 61, 0); }
            100% { box-shadow: 0 0 0 0 rgba(139, 78, 61, 0); }
        }
        .animate-gentle-pulse {
            animation: gentle-pulse 4s infinite;
        }
    </style>
</head>
<body class="bg-soft-gradient text-on-background min-h-screen flex flex-col font-sans overflow-hidden">
<!-- Top AppBar (Simplified for Welcome Screen - Settings Only) -->
<!-- Suppressing global nav as this is a linear/onboarding entry point -->
<header class="absolute top-0 right-0 p-container-margin-mobile md:p-container-margin-desktop z-50">
<button aria-label="Adult Settings" class="w-tap-target-min h-tap-target-min flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 text-primary">
<span class="material-symbols-outlined text-[32px]">settings</span>
</button>
</header>
<!-- Main Content Canvas (Sanctuary) -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin-mobile md:px-container-margin-desktop">
<!-- Welcome Section -->
<div class="flex flex-col items-center justify-center space-y-section-gap max-w-2xl mx-auto text-center w-full">
<!-- Avatar / Graphic Area (Optional based on design, keeping it minimal) -->
<div class="w-32 h-32 md:w-48 md:h-48 rounded-full bg-surface-container flex items-center justify-center mb-8 shadow-ambient">
<img class="w-full h-full object-cover rounded-full mix-blend-multiply opacity-80" data-alt="A soft, abstract, and friendly geometric shape illustration in warm terracotta and cream colors, designed for a minimalist therapeutic child's app. The lighting is soft and ambient, casting a gentle glow. No harsh lines or bright neon colors. High resolution, organic and calming aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDQLiw0SJaHkAwtV0rqv2e_weMXzYHT-hbfu0EWQq6hevpv9-DIPY4EfuKqwi9Ypy_IVm6WgSrkorU4wKi5cG97AuAnLGVGBsUpcselkw8UXMmkGC9Sxj93H76B7BajOdqZzrVKEcvo4nZ54XL8rv7HDHsbrA5HnWUFrqhFfmbzYj4HeeF9_RzlonDXBp1R-B-fuhVFCt2wUDEcRuTBrTQ9_R9PKjmtrmYKWH8n55cTz64Bu94EtYel8A"/>
</div>
<!-- Greeting Text & Audio Feedback -->
<div class="flex flex-col items-center space-y-4">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-on-surface flex items-center gap-4">
                    Hello!
                    <!-- Audio Prompt Button (Child interactive) -->
<button aria-label="Play Greeting Audio" class="w-16 h-16 flex items-center justify-center rounded-full bg-secondary-container text-on-secondary-container hover:bg-secondary-fixed transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</h1>
<p class="font-headline-md text-headline-md text-on-surface-variant max-w-md">
                    Ready to play?
                </p>
</div>
<!-- Primary Action Button (Tactile, Large) -->
<button class="mt-12 w-64 h-[80px] bg-primary text-on-primary font-interactive-child text-interactive-child rounded-[24px] shadow-ambient active-sink transition-all animate-gentle-pulse flex items-center justify-center gap-3">
<span>Start</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
</main>
<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.querySelector('button.bg-primary');
            const audioBtn = document.querySelector('button[aria-label="Play Greeting Audio"]');

            if(startBtn) {
                startBtn.addEventListener('click', function() {
                    // Feedback interaction
                    this.classList.add('bg-primary-container', 'text-on-primary-container');
                    setTimeout(() => {
                        this.classList.remove('bg-primary-container', 'text-on-primary-container');
                        // In real app, navigate to first module
                    }, 200);
                });
            }

            if(audioBtn) {
                audioBtn.addEventListener('click', function() {
                    // Visual feedback for audio playing
                    const icon = this.querySelector('.material-symbols-outlined');
                    icon.classList.add('scale-110');
                    setTimeout(() => {
                        icon.classList.remove('scale-110');
                    }, 300);
                });
            }
        });
    </script>
</body></html>
