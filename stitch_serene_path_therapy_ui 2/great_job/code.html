            0%, 100% { transform: translateY(0); }

        }

<main class="w-full max-w-2xl px-container-margin-mobile md:px-container-margin-desktop flex flex-col items-center justify-center text-center space-y-section-gap">

<div class="flex flex-col items-center justify-center space-y-6">

<div class="w-48 h-48 rounded-full bg-primary-container flex items-center justify-center shadow-[0_8px_32px_rgba(139,78,61,0.12)] animate-float">
<span class="material-symbols-outlined filled-icon text-[96px] text-primary" data-icon="star">star</span>
</div>

<div class="space-y-4 max-w-md">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg text-primary">Great Job!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">You finished the lesson peacefully and carefully.</p>
</div>
</div>

<button class="flex items-center justify-center space-x-3 bg-surface-container-high hover:bg-surface-variant transition-colors rounded-full px-8 h-tap-target-min text-on-surface group">
<span class="material-symbols-outlined filled-icon text-secondary group-hover:scale-110 transition-transform" data-icon="volume_up">volume_up</span>
<span class="font-interactive-child text-interactive-child">Hear Reward</span>
</button>

<div class="w-full max-w-md flex flex-col space-y-4 pt-8">

<button class="w-full h-tap-target-min bg-primary text-on-primary rounded-full font-interactive-child text-interactive-child hover:bg-surface-tint shadow-[0_4px_16px_rgba(139,78,61,0.15)] active:shadow-none active:translate-y-1 transition-all">

            </button>
