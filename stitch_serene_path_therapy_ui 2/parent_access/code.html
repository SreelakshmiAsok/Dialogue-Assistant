<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Parental Gate</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#ffb5a1",
                        "surface-dim": "#dddad4",
                        "surface-container-high": "#ebe8e2",
                        "inverse-surface": "#31302d",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#b59a7c",
                        "on-secondary-container": "#586749",
                        "surface-container-low": "#f7f3ed",
                        "on-error": "#ffffff",
                        "outline-variant": "#d8c2bc",
                        "on-secondary-fixed-variant": "#3d4b30",
                        "on-surface-variant": "#53433f",
                        "outline": "#85736e",
                        "tertiary-fixed-dim": "#dfc1a2",
                        "on-primary-fixed": "#380d03",
                        "secondary-fixed": "#d7e8c3",
                        "surface-container": "#f1ede7",
                        "surface-variant": "#e6e2dc",
                        "inverse-on-surface": "#f4f0ea",
                        "on-primary-fixed-variant": "#6f3728",
                        "on-secondary-fixed": "#131f08",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#bccca8",
                        "secondary": "#546346",
                        "surface-bright": "#fdf9f3",
                        "on-primary-container": "#5a2718",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#281805",
                        "surface-tint": "#8b4e3d",
                        "error": "#ba1a1a",
                        "primary-fixed-dim": "#ffb5a1",
                        "background": "#fdf9f3",
                        "on-tertiary-fixed-variant": "#58432b",
                        "on-tertiary-container": "#45321b",
                        "primary": "#8b4e3d",
                        "primary-container": "#d68c78",
                        "tertiary-fixed": "#fdddbc",
                        "surface": "#fdf9f3",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#ffdbd1",
                        "tertiary": "#715a40",
                        "surface-container-highest": "#e6e2dc",
                        "on-surface": "#1c1c18",
                        "secondary-container": "#d5e5c0",
                        "on-background": "#1c1c18"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "tap-target-min": "64px",
                        "unit": "8px",
                        "section-gap": "48px",
                        "container-margin-desktop": "80px",
                        "container-margin-mobile": "24px"
                    },
                    "fontFamily": {
                        "display-lg": ["Plus Jakarta Sans"],
                        "interactive-child": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "display-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display-lg": ["48px", { "lineHeight": "64px", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "interactive-child": ["24px", { "lineHeight": "32px", "letterSpacing": "0.02em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "48px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "44px", "letterSpacing": "0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "36px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["18px", { "lineHeight": "28px", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "label-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.04em", "fontWeight": "600" }],
                        "body-lg": ["20px", { "lineHeight": "32px", "letterSpacing": "0.01em", "fontWeight": "400" }]

                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-container-margin-mobile md:p-container-margin-desktop font-body-md">
<!-- Modal Canvas -->
<main class="w-full max-w-[480px]">
<!-- Back Action (Transactional context, nav shell suppressed) -->
<button aria-label="Go back" class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors mb-unit h-tap-target-min">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
<span class="font-label-lg text-label-lg">Cancel</span>
</button>
<!-- Main Card -->
<div class="bg-surface-container-lowest rounded-[32px] p-8 md:p-12 shadow-[0_24px_48px_-12px_rgba(139,78,61,0.08)] flex flex-col gap-section-gap relative overflow-hidden">
<!-- Subtle Decorative Element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container opacity-20 rounded-bl-full -z-10 blur-2xl"></div>
<!-- Header Section -->
<header class="flex flex-col gap-unit text-center">
<div class="w-16 h-16 rounded-full bg-surface-container-high flex items-center justify-center mx-auto mb-4 text-on-surface-variant">
<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">
                    For Parents
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[300px] mx-auto">
                    Please solve this simple math problem to access account settings.
                </p>
</header>
<!-- Verification Section -->
<section class="flex flex-col gap-gutter bg-surface-container-low rounded-2xl p-6">
<div class="flex items-center justify-center gap-4">
<span class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary">4</span>
<span class="material-symbols-outlined text-primary text-[32px]" style="font-variation-settings: 'FILL' 0;">add</span>
<span class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary">3</span>
<span class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface">=</span>
<div class="relative">
<label class="sr-only" for="math-answer">Answer</label>
<input aria-label="Enter the sum of 4 and 3" class="w-[80px] h-tap-target-min bg-surface-container-lowest border-2 border-outline-variant rounded-xl text-center font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-on-surface focus:border-primary focus:ring-0 transition-colors shadow-sm" id="math-answer" inputmode="numeric" pattern="[0-9]*" placeholder="?" type="number"/>
</div>
</div>
<button class="w-full h-tap-target-min bg-primary text-on-primary font-label-lg text-label-lg rounded-xl hover:bg-surface-tint hover:shadow-[0_8px_24px_-8px_rgba(139,78,61,0.4)] active:shadow-none active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    Verify
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
</section>
<!-- Footer / Info -->
<footer class="text-center">
<button class="inline-flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors font-label-lg text-label-lg group">
<span class="material-symbols-outlined text-[20px] group-hover:rotate-12 transition-transform" style="font-variation-settings: 'FILL' 0;">help</span>
                    Why is this here?
                </button>
</footer>
</div>
</main>
</body></html>
